  /api/v1/stream/sensors/{namespace}/logs:
    get:
      tags:
      - SensorService
      operationId: SensorService_SensorsLogs
      parameters:
      - type: string
        name: namespace
        in: path
        required: true
      - type: string
        description: optional - only return entries for this sensor name.
        name: name
        in: query
      - type: string
        description: optional - only return entries for this trigger.
        name: triggerName
        in: query
      - type: string
        description: option - only return entries where `msg` contains this regular expressions.
        name: grep
        in: query
      - type: string
        description: 'The container for which to stream logs. Defaults to only container if there is one container in the pod.

          +optional.'
        name: podLogOptions.container
        in: query
      - type: boolean
        description: 'Follow the log stream of the pod. Defaults to false.

          +optional.'
        name: podLogOptions.follow
        in: query
      - type: boolean
        description: 'Return previous terminated container logs. Defaults to false.

          +optional.'
        name: podLogOptions.previous
        in: query
      - type: string
        format: int64
        description: 'A relative time in seconds before the current time from which to show logs. If this value

          precedes the time a pod was started, only logs since the pod start will be returned.

          If this value is in the future, no logs will be returned.

          Only one of sinceSeconds or sinceTime may be specified.

          +optional.'
        name: podLogOptions.sinceSeconds
        in: query
      - type: string
        format: int64
        description: 'Represents seconds of UTC time since Unix epoch

          1970-01-01T00:00:00Z. Must be from 0001-01-01T00:00:00Z to

          9999-12-31T23:59:59Z inclusive.'
        name: podLogOptions.sinceTime.seconds
        in: query
      - type: integer
        format: int32
        description: 'Non-negative fractions of a second at nanosecond resolution. Negative

          second values with fractions must still have non-negative nanos values

          that count forward in time. Must be from 0 to 999,999,999

          inclusive. This field may be limited in precision depending on context.'
        name: podLogOptions.sinceTime.nanos
        in: query
      - type: boolean
        description: 'If true, add an RFC3339 or RFC3339Nano timestamp at the beginning of every line

          of log output. Defaults to false.

          +optional.'
        name: podLogOptions.timestamps
        in: query
      - type: string
        format: int64
        description: 'If set, the number of lines from the end of the logs to show. If not specified,

          logs are shown from the creation of the container or sinceSeconds or sinceTime.

          Note that when "TailLines" is specified, "Stream" can only be set to nil or "All".

          +optional.'
        name: podLogOptions.tailLines
        in: query
      - type: string
        format: int64
        description: 'If set, the number of bytes to read from the server before terminating the

          log output. This may not display a complete final line of logging, and may return

          slightly more or slightly less than the specified limit.

          +optional.'
        name: podLogOptions.limitBytes
        in: query
      - type: boolean
        description: 'insecureSkipTLSVerifyBackend indicates that the apiserver should not confirm the validity of the

          serving certificate of the backend it is connecting to.  This will make the HTTPS connection between the apiserver

          and the backend insecure. This means the apiserver cannot verify the log data it is receiving came from the real

          kubelet.  If the kubelet is configured to verify the apiserver''s TLS credentials, it does not mean the

          connection to the real kubelet is vulnerable to a man in the middle attack (e.g. an attacker could not intercept

          the actual log data coming from the real kubelet).

          +optional.'
        name: podLogOptions.insecureSkipTLSVerifyBackend
        in: query
      - type: string
        description: 'Specify which container log stream to return to the client.

          Acceptable values are "All", "Stdout" and "Stderr". If not specified, "All" is used, and both stdout and stderr

          are returned interleaved.

          Note that when "TailLines" is specified, "Stream" can only be set to nil or "All".

          +featureGate=PodLogsQuerySplitStreams

          +optional.'
        name: podLogOptions.stream
        in: query
      responses:
        '200':
          description: A successful response.(streaming responses)
          schema:
            type: object
            title: Stream result of sensor.LogEntry
            properties:
              error:
                $ref: '#/definitions/grpc.gateway.runtime.StreamError'
              result:
                $ref: '#/definitions/sensor.LogEntry'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
definitions:
  grpc.gateway.runtime.StreamError:
    type: object
    properties:
      details:
        type: array
        items:
          $ref: '#/definitions/google.protobuf.Any'
      grpc_code:
        type: integer
      http_code:
        type: integer
      http_status:
        type: string
      message:
        type: string
  io.k8s.api.core.v1.ScaleIOVolumeSource:
    description: ScaleIOVolumeSource represents a persistent ScaleIO volume
    type: object
    required:
    - gateway
    - system
    - secretRef
    properties:
      fsType:
        description: fsType is the filesystem type to mount. Must be a filesystem type supported by the host operating system. Ex. "ext4", "xfs", "ntfs". Default is "xfs".
        type: string
      gateway:
        description: gateway is the host address of the ScaleIO API Gateway.
        type: string
      protectionDomain:
        description: protectionDomain is the name of the ScaleIO Protection Domain for the configured storage.
        type: string
      readOnly:
        description: readOnly Defaults to false (read/write). ReadOnly here will force the ReadOnly setting in VolumeMounts.
        type: boolean
      secretRef:
        description: secretRef references to the secret for ScaleIO user and other sensitive information. If this is not provided, Login operation will fail.
        $ref: '#/definitions/io.k8s.api.core.v1.LocalObjectReference'
      sslEnabled:
        description: sslEnabled Flag enable/disable SSL communication with Gateway, default false
        type: boolean
      storageMode:
        description: storageMode indicates whether the storage for a volume should be ThickProvisioned or ThinProvisioned. Default is ThinProvisioned.
        type: string
      storagePool:
        description: storagePool is the ScaleIO Storage Pool associated with the protection domain.
        type: string
      system:
        description: system is the name of the storage system as configured in ScaleIO.
        type: string
      volumeName:
        description: volumeName is the name of a volume already created in the ScaleIO system that is associated with this volume source.
        type: string
  github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.EventDependency:
    type: object
    title: EventDependency describes a dependency
    properties:
      eventName:
        type: string
        title: EventName is the name of the event
      eventSourceName:
        type: string
        title: EventSourceName is the name of EventSource that Sensor depends on
      filters:
        title: Filters and rules governing toleration of success and constraints on the context and data of an event
        $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.EventDependencyFilter'
      filtersLogicalOperator:
        description: 'FiltersLogicalOperator defines how different filters are evaluated together.

          Available values: and (&&), or (||)

          Is optional and if left blank treated as and (&&).'
        type: string
      name:
        type: string
        title: Name is a unique name of this dependency
      transform:
        title: Transform transforms the event data
        $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.EventDependencyTransformer'
  io.k8s.api.core.v1.PhotonPersistentDiskVolumeSource:
    description: Represents a Photon Controller persistent disk resource.
    type: object
    required:
    - pdID
    properties:
      fsType:
        description: fsType is the filesystem type to mount. Must be a filesystem type supported by the host operating system. Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.
        type: string
      pdID:
        description: pdID is the ID that identifies Photon Controller persistent disk
        type: string
  io.k8s.api.core.v1.Volume:
    description: Volume represents a named volume in a pod that may be accessed by any container in the pod.
    type: object
    required:
    - name
    properties:
      awsElasticBlockStore:
        description: 'awsElasticBlockStore represents an AWS Disk resource that is attached to a kubelet''s host machine and then exposed to the pod. Deprecated: AWSElasticBlockStore is deprecated. All operations for the in-tree awsElasticBlockStore type are redirected to the ebs.csi.aws.com CSI driver. More info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore'
        $ref: '#/definitions/io.k8s.api.core.v1.AWSElasticBlockStoreVolumeSource'
      azureDisk:
        description: 'azureDisk represents an Azure Data Disk mount on the host and bind mount to the pod. Deprecated: AzureDisk is deprecated. All operations for the in-tree azureDisk type are redirected to the disk.csi.azure.com CSI driver.'
        $ref: '#/definitions/io.k8s.api.core.v1.AzureDiskVolumeSource'
      azureFile:
        description: 'azureFile represents an Azure File Service mount on the host and bind mount to the pod. Deprecated: AzureFile is deprecated. All operations for the in-tree azureFile type are redirected to the file.csi.azure.com CSI driver.'
        $ref: '#/definitions/io.k8s.api.core.v1.AzureFileVolumeSource'
      cephfs:
        description: 'cephFS represents a Ceph FS mount on the host that shares a pod''s lifetime. Deprecated: CephFS is deprecated and the in-tree cephfs type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.CephFSVolumeSource'
      cinder:
        description: 'cinder represents a cinder volume attached and mounted on kubelets host machine. Deprecated: Cinder is deprecated. All operations for the in-tree cinder type are redirected to the cinder.csi.openstack.org CSI driver. More info: https://examples.k8s.io/mysql-cinder-pd/README.md'
        $ref: '#/definitions/io.k8s.api.core.v1.CinderVolumeSource'
      configMap:
        description: configMap represents a configMap that should populate this volume
        $ref: '#/definitions/io.k8s.api.core.v1.ConfigMapVolumeSource'
      csi:
        description: csi (Container Storage Interface) represents ephemeral storage that is handled by certain external CSI drivers.
        $ref: '#/definitions/io.k8s.api.core.v1.CSIVolumeSource'
      downwardAPI:
        description: downwardAPI represents downward API about the pod that should populate this volume
        $ref: '#/definitions/io.k8s.api.core.v1.DownwardAPIVolumeSource'
      emptyDir:
        description: 'emptyDir represents a temporary directory that shares a pod''s lifetime. More info: https://kubernetes.io/docs/concepts/storage/volumes#emptydir'
        $ref: '#/definitions/io.k8s.api.core.v1.EmptyDirVolumeSource'
      ephemeral:
        description: "ephemeral represents a volume that is handled by a cluster storage driver. The volume's lifecycle is tied to the pod that defines it - it will be created before the pod starts, and deleted when the pod is removed.\n\nUse this if: a) the volume is only needed while the pod runs, b) features of normal volumes like restoring from snapshot or capacity\n   tracking are needed,\nc) the storage driver is specified through a storage class, and d) the storage driver supports dynamic volume provisioning through\n   a PersistentVolumeClaim (see EphemeralVolumeSource for more\n   information on the connection between this volume type\n   and PersistentVolumeClaim).\n\nUse PersistentVolumeClaim or one of the vendor-specific APIs for volumes that persist for longer than the lifecycle of an individual pod.\n\nUse CSI for light-weight local ephemeral volumes if the CSI driver is meant to be used that way - see the documentation of the driver for more information.\n\nA pod can use both types of ephemeral volumes and persistent volumes at the same time."
        $ref: '#/definitions/io.k8s.api.core.v1.EphemeralVolumeSource'
      fc:
        description: fc represents a Fibre Channel resource that is attached to a kubelet's host machine and then exposed to the pod.
        $ref: '#/definitions/io.k8s.api.core.v1.FCVolumeSource'
      flexVolume:
        description: 'flexVolume represents a generic volume resource that is provisioned/attached using an exec based plugin. Deprecated: FlexVolume is deprecated. Consider using a CSIDriver instead.'
        $ref: '#/definitions/io.k8s.api.core.v1.FlexVolumeSource'
      flocker:
        description: 'flocker represents a Flocker volume attached to a kubelet''s host machine. This depends on the Flocker control service being running. Deprecated: Flocker is deprecated and the in-tree flocker type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.FlockerVolumeSource'
      gcePersistentDisk:
        description: 'gcePersistentDisk represents a GCE Disk resource that is attached to a kubelet''s host machine and then exposed to the pod. Deprecated: GCEPersistentDisk is deprecated. All operations for the in-tree gcePersistentDisk type are redirected to the pd.csi.storage.gke.io CSI driver. More info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk'
        $ref: '#/definitions/io.k8s.api.core.v1.GCEPersistentDiskVolumeSource'
      gitRepo:
        description: 'gitRepo represents a git repository at a particular revision. Deprecated: GitRepo is deprecated. To provision a container with a git repo, mount an EmptyDir into an InitContainer that clones the repo using git, then mount the EmptyDir into the Pod''s container.'
        $ref: '#/definitions/io.k8s.api.core.v1.GitRepoVolumeSource'
      glusterfs:
        description: 'glusterfs represents a Glusterfs mount on the host that shares a pod''s lifetime. Deprecated: Glusterfs is deprecated and the in-tree glusterfs type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.GlusterfsVolumeSource'
      hostPath:
        description: 'hostPath represents a pre-existing file or directory on the host machine that is directly exposed to the container. This is generally used for system agents or other privileged things that are allowed to see the host machine. Most containers will NOT need this. More info: https://kubernetes.io/docs/concepts/storage/volumes#hostpath'
        $ref: '#/definitions/io.k8s.api.core.v1.HostPathVolumeSource'
      image:
        description: 'image represents an OCI object (a container image or artifact) pulled and mounted on the kubelet''s host machine. The volume is resolved at pod startup depending on which PullPolicy value is provided:


          - Always: the kubelet always attempts to pull the reference. Container creation will fail If the pull fails. - Never: the kubelet never pulls the reference and only uses a local image or artifact. Container creation will fail if the reference isn''t present. - IfNotPresent: the kubelet pulls if the reference isn''t already present on disk. Container creation will fail if the reference isn''t present and the pull fails.


          The volume gets re-resolved if the pod gets deleted and recreated, which means that new remote content will become available on pod recreation. A failure to resolve or pull the image during pod startup will block containers from starting and may add significant latency. Failures will be retried using normal volume backoff and will be reported on the pod reason and message. The types of objects that may be mounted by this volume are defined by the container runtime implementation on a host machine and at minimum must include all valid types supported by the container image field. The OCI object gets mounted in a single directory (spec.containers[*].volumeMounts.mountPath) by merging the manifest layers in the same way as for container images. The volume will be mounted read-only (ro) and non-executable files (noexec). Sub path mounts for containers are not supported (spec.containers[*].volumeMounts.subpath) before 1.33. The field spec.securityContext.fsGroupChangePolicy has no effect on this volume type.'
        $ref: '#/definitions/io.k8s.api.core.v1.ImageVolumeSource'
      iscsi:
        description: 'iscsi represents an ISCSI Disk resource that is attached to a kubelet''s host machine and then exposed to the pod. More info: https://kubernetes.io/docs/concepts/storage/volumes/#iscsi'
        $ref: '#/definitions/io.k8s.api.core.v1.ISCSIVolumeSource'
      name:
        description: 'name of the volume. Must be a DNS_LABEL and unique within the pod. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
        type: string
      nfs:
        description: 'nfs represents an NFS mount on the host that shares a pod''s lifetime More info: https://kubernetes.io/docs/concepts/storage/volumes#nfs'
        $ref: '#/definitions/io.k8s.api.core.v1.NFSVolumeSource'
      persistentVolumeClaim:
        description: 'persistentVolumeClaimVolumeSource represents a reference to a PersistentVolumeClaim in the same namespace. More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims'
        $ref: '#/definitions/io.k8s.api.core.v1.PersistentVolumeClaimVolumeSource'
      photonPersistentDisk:
        description: 'photonPersistentDisk represents a PhotonController persistent disk attached and mounted on kubelets host machine. Deprecated: PhotonPersistentDisk is deprecated and the in-tree photonPersistentDisk type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.PhotonPersistentDiskVolumeSource'
      portworxVolume:
        description: 'portworxVolume represents a portworx volume attached and mounted on kubelets host machine. Deprecated: PortworxVolume is deprecated. All operations for the in-tree portworxVolume type are redirected to the pxd.portworx.com CSI driver when the CSIMigrationPortworx feature-gate is on.'
        $ref: '#/definitions/io.k8s.api.core.v1.PortworxVolumeSource'
      projected:
        description: projected items for all in one resources secrets, configmaps, and downward API
        $ref: '#/definitions/io.k8s.api.core.v1.ProjectedVolumeSource'
      quobyte:
        description: 'quobyte represents a Quobyte mount on the host that shares a pod''s lifetime. Deprecated: Quobyte is deprecated and the in-tree quobyte type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.QuobyteVolumeSource'
      rbd:
        description: 'rbd represents a Rados Block Device mount on the host that shares a pod''s lifetime. Deprecated: RBD is deprecated and the in-tree rbd type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.RBDVolumeSource'
      scaleIO:
        description: 'scaleIO represents a ScaleIO persistent volume attached and mounted on Kubernetes nodes. Deprecated: ScaleIO is deprecated and the in-tree scaleIO type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.ScaleIOVolumeSource'
      secret:
        description: 'secret represents a secret that should populate this volume. More info: https://kubernetes.io/docs/concepts/storage/volumes#secret'
        $ref: '#/definitions/io.k8s.api.core.v1.SecretVolumeSource'
      storageos:
        description: 'storageOS represents a StorageOS volume attached and mounted on Kubernetes nodes. Deprecated: StorageOS is deprecated and the in-tree storageos type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.StorageOSVolumeSource'
      vsphereVolume:
        description: 'vsphereVolume represents a vSphere volume attached and mounted on kubelets host machine. Deprecated: VsphereVolume is deprecated. All operations for the in-tree vsphereVolume type are redirected to the csi.vsphere.vmware.com CSI driver.'
        $ref: '#/definitions/io.k8s.api.core.v1.VsphereVirtualDiskVolumeSource'
  github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.Sensor:
    type: object
    title: 'Sensor is the definition of a sensor resource

      +genclient

      +genclient:noStatus

      +kubebuilder:resource:shortName=sn

      +kubebuilder:subresource:status

      +k8s:deepcopy-gen:interfaces=io.k8s.apimachinery/pkg/runtime.Object

      +k8s:openapi-gen=true'
    properties:
      metadata:
        $ref: '#/definitions/io.k8s.apimachinery.pkg.apis.meta.v1.ObjectMeta'
      spec:
        $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.SensorSpec'
      status:
        title: +optional
        $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.SensorStatus'
  io.k8s.api.core.v1.GCEPersistentDiskVolumeSource:
    description: 'Represents a Persistent Disk resource in Google Compute Engine.


      A GCE PD must exist before mounting to a container. The disk must also be in the same GCE project and zone as the kubelet. A GCE PD can only be mounted as read/write once or read-only many times. GCE PDs support ownership management and SELinux relabeling.'
    type: object
    required:
    - pdName
    properties:
      fsType:
        description: 'fsType is filesystem type of the volume that you want to mount. Tip: Ensure that the filesystem type is supported by the host operating system. Examples: "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified. More info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk'
        type: string
      partition:
        description: 'partition is the partition in the volume that you want to mount. If omitted, the default is to mount by volume name. Examples: For volume /dev/sda1, you specify the partition as "1". Similarly, the volume partition for /dev/sda is "0" (or you can leave the property empty). More info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk'
        type: integer
      pdName:
        description: 'pdName is unique name of the PD resource in GCE. Used to identify the disk in GCE. More info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk'
        type: string
      readOnly:
        description: 'readOnly here will force the ReadOnly setting in VolumeMounts. Defaults to false. More info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk'
        type: boolean
  io.k8s.api.core.v1.DownwardAPIVolumeSource:
    description: DownwardAPIVolumeSource represents a volume containing downward API info. Downward API volumes support ownership management and SELinux relabeling.
    type: object
    properties:
      defaultMode:
        description: 'Optional: mode bits to use on created files by default. Must be a Optional: mode bits used to set permissions on created files by default. Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511. YAML accepts both octal and decimal values, JSON requires decimal values for mode bits. Defaults to 0644. Directories within the path are not affected by this setting. This might be in conflict with other options that affect the file mode, like fsGroup, and the result can be other mode bits set.'
        type: integer
      items:
        description: Items is a list of downward API volume file
        type: array
        items:
          $ref: '#/definitions/io.k8s.api.core.v1.DownwardAPIVolumeFile'
        x-kubernetes-list-type: atomic
  io.k8s.api.core.v1.NodeAffinity:
    description: Node affinity is a group of node affinity scheduling rules.
    type: object
    properties:
      preferredDuringSchedulingIgnoredDuringExecution:
        description: The scheduler will prefer to schedule pods to nodes that satisfy the affinity expressions specified by this field, but it may choose a node that violates one or more of the expressions. The node that is most preferred is the one with the greatest sum of weights, i.e. for each node that meets all of the scheduling requirements (resource request, requiredDuringScheduling affinity expressions, etc.), compute a sum by iterating through the elements of this field and adding "weight" to the sum if the node matches the corresponding matchExpressions; the node(s) with the highest sum are the most preferred.
        type: array
        items:
          $ref: '#/definitions/io.k8s.api.core.v1.PreferredSchedulingTerm'
        x-kubernetes-list-type: atomic
      requiredDuringSchedulingIgnoredDuringExecution:
        description: If the affinity requirements specified by this field are not met at scheduling time, the pod will not be scheduled onto the node. If the affinity requirements specified by this field cease to be met at some point during pod execution (e.g. due to an update), the system may or may not try to eventually evict the pod from its node.
        $ref: '#/definitions/io.k8s.api.core.v1.NodeSelector'
  github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.SchemaRegistryConfig:
    type: object
    title: SchemaRegistryConfig refers to configuration for a client
    properties:
      auth:
        title: 'SchemaRegistry - basic authentication

          +optional'
        $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.BasicAuth'
      schemaId:
        type: integer
        title: 'Schema ID

          +optional'
      url:
        description: Schema Registry URL.
        type: string
  io.k8s.api.core.v1.EmptyDirVolumeSource:
    description: Represents an empty directory for a pod. Empty directory volumes support ownership management and SELinux relabeling.
    type: object
    properties:
      medium:
        description: 'medium represents what type of storage medium should back this directory. The default is "" which means to use the node''s default medium. Must be an empty string (default) or Memory. More info: https://kubernetes.io/docs/concepts/storage/volumes#emptydir'
        type: string
      sizeLimit:
        description: 'sizeLimit is the total amount of local storage required for this EmptyDir volume. The size limit is also applicable for memory medium. The maximum usage on memory medium EmptyDir would be the minimum value between the SizeLimit specified here and the sum of memory limits of all containers in a pod. The default is nil which means that the limit is undefined. More info: https://kubernetes.io/docs/concepts/storage/volumes#emptydir'
        $ref: '#/definitions/io.k8s.apimachinery.pkg.api.resource.Quantity'
  github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.LogTrigger:
    type: object
    properties:
      intervalSeconds:
        type: string
        format: uint64
        title: 'Only print messages every interval. Useful to prevent logging too much data for busy events.

          +optional'
  github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.SecureHeader:
    type: object
    title: SecureHeader refers to HTTP Headers with auth tokens as values
    properties:
      name:
        type: string
      valueFrom:
        title: Values can be read from either secrets or configmaps
        $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.ValueFromSource'
  github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.KafkaTrigger:
    description: KafkaTrigger refers to the specification of the Kafka trigger.
    type: object
    properties:
      compress:
        type: boolean
        title: 'Compress determines whether to compress message or not.

          Defaults to false.

          If set to true, compresses message using snappy compression.

          +optional'
      flushFrequency:
        type: integer
        title: 'FlushFrequency refers to the frequency in milliseconds to flush batches.

          Defaults to 500 milliseconds.

          +optional'
      headers:
        type: object
        title: 'Headers for the Kafka Messages.

          +optional'
        additionalProperties:
          type: string
      parameters:
        description: Parameters is the list of parameters that is applied to resolved Kafka trigger object.
        type: array
        items:
          $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.TriggerParameter'
      partition:
        type: integer
        title: '+optional

          DEPRECATED'
      partitioningKey:
        description: 'The partitioning key for the messages put on the Kafka topic.

          +optional.'
        type: string
      payload:
        description: Payload is the list of key-value extracted from an event payload to construct the request payload.
        type: array
        items:
          $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.TriggerParameter'
      requiredAcks:
        description: 'RequiredAcks used in producer to tell the broker how many replica acknowledgements

          Defaults to 1 (Only wait for the leader to ack).

          +optional.'
        type: integer
      sasl:
        title: 'SASL configuration for the kafka client

          +optional'
        $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.SASLConfig'
      schemaRegistry:
        title: 'Schema Registry configuration to producer message with avro format

          +optional'
        $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.SchemaRegistryConfig'
      secureHeaders:
        type: array
        title: 'Secure Headers stored in Kubernetes Secrets for the Kafka messages.

          +optional'
        items:
          $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.SecureHeader'
      tls:
        title: 'TLS configuration for the Kafka producer.

          +optional'
        $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.TLSConfig'
      topic:
        type: string
        title: 'Name of the topic.

          More info at https://kafka.apache.org/documentation/#intro_topics'
      url:
        description: URL of the Kafka broker, multiple URLs separated by comma.
        type: string
      version:
        type: string
        title: 'Specify what kafka version is being connected to enables certain features in sarama, defaults to 1.0.0

          +optional'
  github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.AzureEventHubsTrigger:
    type: object
    title: AzureEventHubsTrigger refers to specification of the Azure Event Hubs Trigger
    properties:
      fqdn:
        type: string
        title: FQDN refers to the namespace dns of Azure Event Hubs to be used i.e. <namespace>.servicebus.windows.net
      hubName:
        type: string
        title: HubName refers to the Azure Event Hub to send events to
      parameters:
        type: array
        title: 'Parameters is the list of key-value extracted from event''s payload that are applied to

          the trigger resource.

          +optional'
        items:
          $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.TriggerParameter'
      payload:
        description: Payload is the list of key-value extracted from an event payload to construct the request payload.
        type: array
        items:
          $ref: '#/definitions/github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.TriggerParameter'
      sharedAccessKey:
        title: SharedAccessKey refers to a K8s secret containing the primary key for the
        $ref: '#/definitions/io.k8s.api.core.v1.SecretKeySelector'
      sharedAccessKeyName:
        title: SharedAccessKeyName refers to the name of the Shared Access Key
        $ref: '#/definitions/io.k8s.api.core.v1.SecretKeySelector'
  io.k8s.api.core.v1.ServiceAccountTokenProjection:
    description: ServiceAccountTokenProjection represents a projected service account token volume. This projection can be used to insert a service account token into the pods runtime filesystem for use against APIs (Kubernetes API Server or otherwise).
    type: object
    required:
    - path
    properties:
      audience:
        description: audience is the intended audience of the token. A recipient of a token must identify itself with an identifier specified in the audience of the token, and otherwise should reject the token. The audience defaults to the identifier of the apiserver.
        type: string
      expirationSeconds:
        description: expirationSeconds is the requested duration of validity of the service account token. As the token approaches expiration, the kubelet volume plugin will proactively rotate the service account token. The kubelet will start trying to rotate the token if the token is older than 80 percent of its time to live or if the token is older than 24 hours.Defaults to 1 hour and must be at least 10 minutes.
        type: integer
      path:
        description: path is the path relative to the mount point of the file to project the token into.
        type: string
  github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.Metadata:
    type: object
    title: Metadata holds the annotations and labels of an event source pod
    properties:
      annotations:
        type: object
        additionalProperties:
          type: string
      labels:
        type: object
        additionalProperties:
          type: string
  io.k8s.api.core.v1.Sysctl:
    description: Sysctl defines a kernel parameter to be set
    type: object
    required:
    - name
    - value
    properties:
      name:
        description: Name of a property to set
        type: string
      value:
        description: Value of a property to set
        type: string
  github.com.argoproj.argo_events.pkg.apis.events.v1alpha1.DataFilter:
    description: DataFilter describes constraints and filters for event data.
    type: object
    properties:
      comparator:
        description: 'Comparator compares the event data with a user given value.

          Can be ">=", ">", "=", "!=", "<", or "<=".

          Is optional, and if left blank treated as equality "=".'
        type: string
      path:
        description: 'Path is the JSONPath of the event''s (JSON decoded) data key.

          Path is a series of keys separated by a dot. A key may contain wildcard characters ''*'' and ''?''.

          To access an array value use the index as the key. The dot and wildcard characters can be escaped with ''\\''.

          See https://github.com/tidwall/gjson#path-syntax for more information on how to use this.'
        type: string
      template:
        type: string
        title: 'Template is a go-template for extracting a string from the event''s data.

          A Template is evaluated with provided path, type and value.

          The templating follows the standard go-template syntax as well as sprig''s extra functions.

          See https://pkg.go.dev/text/template and https://masterminds.github.io/sprig/'
      type:
        type: string
        title: Type contains the JSON type of the data
      value:
        description: 'Value is the allowed string values for this key.

          Booleans are parsed using strconv.ParseBool(),

          Numbers are parsed as float64 using strconv.ParseFloat(),

          Strings are treated as regular expressions,

          Nils value is ignored.'
        type: array
        items:
          type: string
  io.k8s.api.core.v1.ClusterTrustBundleProjection:
    description: ClusterTrustBundleProjection describes how to select a set of ClusterTrustBundle objects and project their contents into the pod filesystem.
    type: object
    required:
    - path
    properties:
      labelSelector:
        description: Select all ClusterTrustBundles that match this label selector.  Only has effect if signerName is set.  Mutually-exclusive with name.  If unset, interpreted as "match nothing".  If set but empty, interpreted as "match everything".
        $ref: '#/definitions/io.k8s.apimachinery.pkg.apis.meta.v1.LabelSelector'
      name:
        description: Select a single ClusterTrustBundle by object name.  Mutually-exclusive with signerName and labelSelector.
        type: string
      optional:
        description: If true, don't block pod startup if the referenced ClusterTrustBundle(s) aren't available.  If using name, then the named ClusterTrustBundle is allowed not to exist.  If using signerName, then the combination of signerName and labelSelector is allowed to match zero ClusterTrustBundles.
        type: boolean
      path:
        description: Relative path from the volume root to write the bundle.
        type: string
      signerName:
        description: Select all ClusterTrustBundles that match this signer name. Mutually-exclusive with name.  The contents of all selected ClusterTrustBundles will be unified and deduplicated.
        type: string
  io.k8s.api.core.v1.VolumeProjection:
    description: Projection that may be projected along with other supported volume types. Exactly one of these fields must be set.
    type: object
    properties:
      clusterTrustBundle:
        description: 'ClusterTrustBundle allows a pod to access the `.spec.trustBundle` field of ClusterTrustBundle objects in an auto-updating file.


          Alpha, gated by the ClusterTrustBundleProjection feature gate.


          ClusterTrustBundle objects can either be selected by name, or by the combination of signer name and a label selector.


          Kubelet performs aggressive normalization of the PEM contents written into the pod filesystem.  Esoteric PEM features such as inter-block comments and block headers are stripped.  Certificates are deduplicated. The ordering of certificates within the file is arbitrary, and Kubelet may change the order over time.'
        $ref: '#/definitions/io.k8s.api.core.v1.ClusterTrustBundleProjection'
      configMap:
        description: configMap information about the configMap data to project
        $ref: '#/definitions/io.k8s.api.core.v1.ConfigMapProjection'
      downwardAPI:
