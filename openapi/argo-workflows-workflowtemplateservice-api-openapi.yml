swagger: '2.0'
info:
  description: Argo Workflows is an open source container-native workflow engine for orchestrating parallel jobs on Kubernetes. For more information, please see https://argo-workflows.readthedocs.io/en/latest/
  title: Argo Workflows ArchivedWorkflowService WorkflowTemplateService API
  version: 3.6.0
host: localhost:2746
schemes:
- http
- https
consumes:
- application/json
produces:
- application/json
security:
- BearerToken: []
tags:
- name: WorkflowTemplateService
paths:
  /api/v1/workflow-templates/{namespace}:
    get:
      tags:
      - WorkflowTemplateService
      operationId: WorkflowTemplateService_ListWorkflowTemplates
      parameters:
      - type: string
        name: namespace
        in: path
        required: true
      - type: string
        name: namePattern
        in: query
      - type: string
        description: 'A selector to restrict the list of returned objects by their labels.

          Defaults to everything.

          +optional.'
        name: listOptions.labelSelector
        in: query
      - type: string
        description: 'A selector to restrict the list of returned objects by their fields.

          Defaults to everything.

          +optional.'
        name: listOptions.fieldSelector
        in: query
      - type: boolean
        description: 'Watch for changes to the described resources and return them as a stream of

          add, update, and remove notifications. Specify resourceVersion.

          +optional.'
        name: listOptions.watch
        in: query
      - type: boolean
        description: 'allowWatchBookmarks requests watch events with type "BOOKMARK".

          Servers that do not implement bookmarks may ignore this flag and

          bookmarks are sent at the server''s discretion. Clients should not

          assume bookmarks are returned at any specific interval, nor may they

          assume the server will send any BOOKMARK event during a session.

          If this is not a watch, this field is ignored.

          +optional.'
        name: listOptions.allowWatchBookmarks
        in: query
      - type: string
        description: 'resourceVersion sets a constraint on what resource versions a request may be served from.

          See https://kubernetes.io/docs/reference/using-api/api-concepts/#resource-versions for

          details.


          Defaults to unset

          +optional'
        name: listOptions.resourceVersion
        in: query
      - type: string
        description: 'resourceVersionMatch determines how resourceVersion is applied to list calls.

          It is highly recommended that resourceVersionMatch be set for list calls where

          resourceVersion is set

          See https://kubernetes.io/docs/reference/using-api/api-concepts/#resource-versions for

          details.


          Defaults to unset

          +optional'
        name: listOptions.resourceVersionMatch
        in: query
      - type: string
        format: int64
        description: 'Timeout for the list/watch call.

          This limits the duration of the call, regardless of any activity or inactivity.

          +optional.'
        name: listOptions.timeoutSeconds
        in: query
      - type: string
        format: int64
        description: 'limit is a maximum number of responses to return for a list call. If more items exist, the

          server will set the `continue` field on the list metadata to a value that can be used with the

          same initial query to retrieve the next set of results. Setting a limit may return fewer than

          the requested amount of items (up to zero items) in the event all requested objects are

          filtered out and clients should only use the presence of the continue field to determine whether

          more results are available. Servers may choose not to support the limit argument and will return

          all of the available results. If limit is specified and the continue field is empty, clients may

          assume that no more results are available. This field is not supported if watch is true.


          The server guarantees that the objects returned when using continue will be identical to issuing

          a single list call without a limit - that is, no objects created, modified, or deleted after the

          first request is issued will be included in any subsequent continued requests. This is sometimes

          referred to as a consistent snapshot, and ensures that a client that is using limit to receive

          smaller chunks of a very large result can ensure they see all possible objects. If objects are

          updated during a chunked list the version of the object that was present at the time the first list

          result was calculated is returned.'
        name: listOptions.limit
        in: query
      - type: string
        description: 'The continue option should be set when retrieving more results from the server. Since this value is

          server defined, clients may only use the continue value from a previous query result with identical

          query parameters (except for the value of continue) and the server may reject a continue value it

          does not recognize. If the specified continue value is no longer valid whether due to expiration

          (generally five to fifteen minutes) or a configuration change on the server, the server will

          respond with a 410 ResourceExpired error together with a continue token. If the client needs a

          consistent list, it must restart their list without the continue field. Otherwise, the client may

          send another list request with the token received with the 410 error, the server will respond with

          a list starting from the next key, but from the latest snapshot, which is inconsistent from the

          previous list results - objects that are created, modified, or deleted after the first list request

          will be included in the response, as long as their keys are after the "next key".


          This field is not supported when watch is true. Clients may start a watch from the last

          resourceVersion value returned by the server and not miss any modifications.'
        name: listOptions.continue
        in: query
      - type: boolean
        description: "`sendInitialEvents=true` may be set together with `watch=true`.\nIn that case, the watch stream will begin with synthetic events to\nproduce the current state of objects in the collection. Once all such\nevents have been sent, a synthetic \"Bookmark\" event  will be sent.\nThe bookmark will report the ResourceVersion (RV) corresponding to the\nset of objects, and be marked with `\"io.k8s.initial-events-end\": \"true\"` annotation.\nAfterwards, the watch stream will proceed as usual, sending watch events\ncorresponding to changes (subsequent to the RV) to objects watched.\n\nWhen `sendInitialEvents` option is set, we require `resourceVersionMatch`\noption to also be set. The semantic of the watch request is as following:\n- `resourceVersionMatch` = NotOlderThan\n  is interpreted as \"data at least as new as the provided `resourceVersion`\"\n  and the bookmark event is send when the state is synced\n  to a `resourceVersion` at least as fresh as the one provided by the ListOptions.\n  If `resourceVersion` is unset, this is interpreted as \"consistent read\" and the\n  bookmark event is send when the state is synced at least to the moment\n  when request started being processed.\n- `resourceVersionMatch` set to any other value or unset\n  Invalid error is returned.\n\nDefaults to true if `resourceVersion=\"\"` or `resourceVersion=\"0\"` (for backward\ncompatibility reasons) and to false otherwise.\n+optional"
        name: listOptions.sendInitialEvents
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/io.argoproj.workflow.v1alpha1.WorkflowTemplateList'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      tags:
      - WorkflowTemplateService
      operationId: WorkflowTemplateService_CreateWorkflowTemplate
      parameters:
      - type: string
        name: namespace
        in: path
        required: true
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/io.argoproj.workflow.v1alpha1.WorkflowTemplateCreateRequest'
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/io.argoproj.workflow.v1alpha1.WorkflowTemplate'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /api/v1/workflow-templates/{namespace}/lint:
    post:
      tags:
      - WorkflowTemplateService
      operationId: WorkflowTemplateService_LintWorkflowTemplate
      parameters:
      - type: string
        name: namespace
        in: path
        required: true
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/io.argoproj.workflow.v1alpha1.WorkflowTemplateLintRequest'
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/io.argoproj.workflow.v1alpha1.WorkflowTemplate'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /api/v1/workflow-templates/{namespace}/{name}:
    get:
      tags:
      - WorkflowTemplateService
      operationId: WorkflowTemplateService_GetWorkflowTemplate
      parameters:
      - type: string
        name: namespace
        in: path
        required: true
      - type: string
        name: name
        in: path
        required: true
      - type: string
        description: 'resourceVersion sets a constraint on what resource versions a request may be served from.

          See https://kubernetes.io/docs/reference/using-api/api-concepts/#resource-versions for

          details.


          Defaults to unset

          +optional'
        name: getOptions.resourceVersion
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/io.argoproj.workflow.v1alpha1.WorkflowTemplate'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    put:
      tags:
      - WorkflowTemplateService
      operationId: WorkflowTemplateService_UpdateWorkflowTemplate
      parameters:
      - type: string
        name: namespace
        in: path
        required: true
      - type: string
        description: 'DEPRECATED: This field is ignored.'
        name: name
        in: path
        required: true
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/io.argoproj.workflow.v1alpha1.WorkflowTemplateUpdateRequest'
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/io.argoproj.workflow.v1alpha1.WorkflowTemplate'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      tags:
      - WorkflowTemplateService
      operationId: WorkflowTemplateService_DeleteWorkflowTemplate
      parameters:
      - type: string
        name: namespace
        in: path
        required: true
      - type: string
        name: name
        in: path
        required: true
      - type: string
        format: int64
        description: 'The duration in seconds before the object should be deleted. Value must be non-negative integer.

          The value zero indicates delete immediately. If this value is nil, the default grace period for the

          specified type will be used.

          Defaults to a per object value if not specified. zero means delete immediately.

          +optional.'
        name: deleteOptions.gracePeriodSeconds
        in: query
      - type: string
        description: 'Specifies the target UID.

          +optional.'
        name: deleteOptions.preconditions.uid
        in: query
      - type: string
        description: 'Specifies the target ResourceVersion

          +optional.'
        name: deleteOptions.preconditions.resourceVersion
        in: query
      - type: boolean
        description: 'Deprecated: please use the PropagationPolicy, this field will be deprecated in 1.7.

          Should the dependent objects be orphaned. If true/false, the "orphan"

          finalizer will be added to/removed from the object''s finalizers list.

          Either this field or PropagationPolicy may be set, but not both.

          +optional.'
        name: deleteOptions.orphanDependents
        in: query
      - type: string
        description: 'Whether and how garbage collection will be performed.

          Either this field or OrphanDependents may be set, but not both.

          The default policy is decided by the existing finalizer set in the

          metadata.finalizers and the resource-specific default policy.

          Acceptable values are: ''Orphan'' - orphan the dependents; ''Background'' -

          allow the garbage collector to delete the dependents in the background;

          ''Foreground'' - a cascading policy that deletes all dependents in the

          foreground.

          +optional.'
        name: deleteOptions.propagationPolicy
        in: query
      - type: array
        items:
          type: string
        collectionFormat: multi
        description: 'When present, indicates that modifications should not be

          persisted. An invalid or unrecognized dryRun directive will

          result in an error response and no further processing of the

          request. Valid values are:

          - All: all dry run stages will be processed

          +optional

          +listType=atomic.'
        name: deleteOptions.dryRun
        in: query
      - type: boolean
        description: 'if set to true, it will trigger an unsafe deletion of the resource in

          case the normal deletion flow fails with a corrupt object error.

          A resource is considered corrupt if it can not be retrieved from

          the underlying storage successfully because of a) its data can

          not be transformed e.g. decryption failure, or b) it fails

          to decode into an object.

          NOTE: unsafe deletion ignores finalizer constraints, skips

          precondition checks, and removes the object from the storage.

          WARNING: This may potentially break the cluster if the workload

          associated with the resource being unsafe-deleted relies on normal

          deletion flow. Use only if you REALLY know what you are doing.

          The default value is false, and the user must opt in to enable it

          +optional.'
        name: deleteOptions.ignoreStoreReadErrorWithClusterBreakingPotential
        in: query
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/io.argoproj.workflow.v1alpha1.WorkflowTemplateDeleteResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
definitions:
  io.argoproj.workflow.v1alpha1.ArtifactoryArtifact:
    description: ArtifactoryArtifact is the location of an artifactory artifact
    type: object
    required:
    - url
    properties:
      passwordSecret:
        description: PasswordSecret is the secret selector to the repository password
        $ref: '#/definitions/io.k8s.api.core.v1.SecretKeySelector'
      url:
        description: URL of the artifact
        type: string
      usernameSecret:
        description: UsernameSecret is the secret selector to the repository username
        $ref: '#/definitions/io.k8s.api.core.v1.SecretKeySelector'
  io.argoproj.workflow.v1alpha1.Amount:
    description: Amount represent a numeric amount.
    type: number
  io.argoproj.workflow.v1alpha1.PluginArtifact:
    description: PluginArtifact is the location of a plugin artifact
    type: object
    required:
    - key
    properties:
      configuration:
        description: Configuration is the plugin defined configuration for the artifact driver plugin
        type: string
      connectionTimeoutSeconds:
        description: ConnectionTimeoutSeconds is the timeout for the artifact driver connection, overriding the driver's timeout
        type: integer
      key:
        description: Key is the path in the artifact repository where the artifact resides
        type: string
      name:
        description: Name is the name of the artifact driver plugin
        type: string
  io.k8s.api.core.v1.ScaleIOVolumeSource:
    description: ScaleIOVolumeSource represents a persistent ScaleIO volume
    type: object
    required:
    - gateway
    - system
    - secretRef
    properties:
      fsType:
        description: fsType is the filesystem type to mount. Must be a filesystem type supported by the host operating system. Ex. "ext4", "xfs", "ntfs". Default is "xfs".
        type: string
      gateway:
        description: gateway is the host address of the ScaleIO API Gateway.
        type: string
      protectionDomain:
        description: protectionDomain is the name of the ScaleIO Protection Domain for the configured storage.
        type: string
      readOnly:
        description: readOnly Defaults to false (read/write). ReadOnly here will force the ReadOnly setting in VolumeMounts.
        type: boolean
      secretRef:
        description: secretRef references to the secret for ScaleIO user and other sensitive information. If this is not provided, Login operation will fail.
        $ref: '#/definitions/io.k8s.api.core.v1.LocalObjectReference'
      sslEnabled:
        description: sslEnabled Flag enable/disable SSL communication with Gateway, default false
        type: boolean
      storageMode:
        description: storageMode indicates whether the storage for a volume should be ThickProvisioned or ThinProvisioned. Default is ThinProvisioned.
        type: string
      storagePool:
        description: storagePool is the ScaleIO Storage Pool associated with the protection domain.
        type: string
      system:
        description: system is the name of the storage system as configured in ScaleIO.
        type: string
      volumeName:
        description: volumeName is the name of a volume already created in the ScaleIO system that is associated with this volume source.
        type: string
  io.k8s.api.core.v1.PhotonPersistentDiskVolumeSource:
    description: Represents a Photon Controller persistent disk resource.
    type: object
    required:
    - pdID
    properties:
      fsType:
        description: fsType is the filesystem type to mount. Must be a filesystem type supported by the host operating system. Ex. "ext4", "xfs", "ntfs". Implicitly inferred to be "ext4" if unspecified.
        type: string
      pdID:
        description: pdID is the ID that identifies Photon Controller persistent disk
        type: string
  io.k8s.api.core.v1.Volume:
    description: Volume represents a named volume in a pod that may be accessed by any container in the pod.
    type: object
    required:
    - name
    properties:
      awsElasticBlockStore:
        description: 'awsElasticBlockStore represents an AWS Disk resource that is attached to a kubelet''s host machine and then exposed to the pod. Deprecated: AWSElasticBlockStore is deprecated. All operations for the in-tree awsElasticBlockStore type are redirected to the ebs.csi.aws.com CSI driver. More info: https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore'
        $ref: '#/definitions/io.k8s.api.core.v1.AWSElasticBlockStoreVolumeSource'
      azureDisk:
        description: 'azureDisk represents an Azure Data Disk mount on the host and bind mount to the pod. Deprecated: AzureDisk is deprecated. All operations for the in-tree azureDisk type are redirected to the disk.csi.azure.com CSI driver.'
        $ref: '#/definitions/io.k8s.api.core.v1.AzureDiskVolumeSource'
      azureFile:
        description: 'azureFile represents an Azure File Service mount on the host and bind mount to the pod. Deprecated: AzureFile is deprecated. All operations for the in-tree azureFile type are redirected to the file.csi.azure.com CSI driver.'
        $ref: '#/definitions/io.k8s.api.core.v1.AzureFileVolumeSource'
      cephfs:
        description: 'cephFS represents a Ceph FS mount on the host that shares a pod''s lifetime. Deprecated: CephFS is deprecated and the in-tree cephfs type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.CephFSVolumeSource'
      cinder:
        description: 'cinder represents a cinder volume attached and mounted on kubelets host machine. Deprecated: Cinder is deprecated. All operations for the in-tree cinder type are redirected to the cinder.csi.openstack.org CSI driver. More info: https://examples.k8s.io/mysql-cinder-pd/README.md'
        $ref: '#/definitions/io.k8s.api.core.v1.CinderVolumeSource'
      configMap:
        description: configMap represents a configMap that should populate this volume
        $ref: '#/definitions/io.k8s.api.core.v1.ConfigMapVolumeSource'
      csi:
        description: csi (Container Storage Interface) represents ephemeral storage that is handled by certain external CSI drivers.
        $ref: '#/definitions/io.k8s.api.core.v1.CSIVolumeSource'
      downwardAPI:
        description: downwardAPI represents downward API about the pod that should populate this volume
        $ref: '#/definitions/io.k8s.api.core.v1.DownwardAPIVolumeSource'
      emptyDir:
        description: 'emptyDir represents a temporary directory that shares a pod''s lifetime. More info: https://kubernetes.io/docs/concepts/storage/volumes#emptydir'
        $ref: '#/definitions/io.k8s.api.core.v1.EmptyDirVolumeSource'
      ephemeral:
        description: "ephemeral represents a volume that is handled by a cluster storage driver. The volume's lifecycle is tied to the pod that defines it - it will be created before the pod starts, and deleted when the pod is removed.\n\nUse this if: a) the volume is only needed while the pod runs, b) features of normal volumes like restoring from snapshot or capacity\n   tracking are needed,\nc) the storage driver is specified through a storage class, and d) the storage driver supports dynamic volume provisioning through\n   a PersistentVolumeClaim (see EphemeralVolumeSource for more\n   information on the connection between this volume type\n   and PersistentVolumeClaim).\n\nUse PersistentVolumeClaim or one of the vendor-specific APIs for volumes that persist for longer than the lifecycle of an individual pod.\n\nUse CSI for light-weight local ephemeral volumes if the CSI driver is meant to be used that way - see the documentation of the driver for more information.\n\nA pod can use both types of ephemeral volumes and persistent volumes at the same time."
        $ref: '#/definitions/io.k8s.api.core.v1.EphemeralVolumeSource'
      fc:
        description: fc represents a Fibre Channel resource that is attached to a kubelet's host machine and then exposed to the pod.
        $ref: '#/definitions/io.k8s.api.core.v1.FCVolumeSource'
      flexVolume:
        description: 'flexVolume represents a generic volume resource that is provisioned/attached using an exec based plugin. Deprecated: FlexVolume is deprecated. Consider using a CSIDriver instead.'
        $ref: '#/definitions/io.k8s.api.core.v1.FlexVolumeSource'
      flocker:
        description: 'flocker represents a Flocker volume attached to a kubelet''s host machine. This depends on the Flocker control service being running. Deprecated: Flocker is deprecated and the in-tree flocker type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.FlockerVolumeSource'
      gcePersistentDisk:
        description: 'gcePersistentDisk represents a GCE Disk resource that is attached to a kubelet''s host machine and then exposed to the pod. Deprecated: GCEPersistentDisk is deprecated. All operations for the in-tree gcePersistentDisk type are redirected to the pd.csi.storage.gke.io CSI driver. More info: https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk'
        $ref: '#/definitions/io.k8s.api.core.v1.GCEPersistentDiskVolumeSource'
      gitRepo:
        description: 'gitRepo represents a git repository at a particular revision. Deprecated: GitRepo is deprecated. To provision a container with a git repo, mount an EmptyDir into an InitContainer that clones the repo using git, then mount the EmptyDir into the Pod''s container.'
        $ref: '#/definitions/io.k8s.api.core.v1.GitRepoVolumeSource'
      glusterfs:
        description: 'glusterfs represents a Glusterfs mount on the host that shares a pod''s lifetime. Deprecated: Glusterfs is deprecated and the in-tree glusterfs type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.GlusterfsVolumeSource'
      hostPath:
        description: 'hostPath represents a pre-existing file or directory on the host machine that is directly exposed to the container. This is generally used for system agents or other privileged things that are allowed to see the host machine. Most containers will NOT need this. More info: https://kubernetes.io/docs/concepts/storage/volumes#hostpath'
        $ref: '#/definitions/io.k8s.api.core.v1.HostPathVolumeSource'
      image:
        description: 'image represents an OCI object (a container image or artifact) pulled and mounted on the kubelet''s host machine. The volume is resolved at pod startup depending on which PullPolicy value is provided:


          - Always: the kubelet always attempts to pull the reference. Container creation will fail If the pull fails. - Never: the kubelet never pulls the reference and only uses a local image or artifact. Container creation will fail if the reference isn''t present. - IfNotPresent: the kubelet pulls if the reference isn''t already present on disk. Container creation will fail if the reference isn''t present and the pull fails.


          The volume gets re-resolved if the pod gets deleted and recreated, which means that new remote content will become available on pod recreation. A failure to resolve or pull the image during pod startup will block containers from starting and may add significant latency. Failures will be retried using normal volume backoff and will be reported on the pod reason and message. The types of objects that may be mounted by this volume are defined by the container runtime implementation on a host machine and at minimum must include all valid types supported by the container image field. The OCI object gets mounted in a single directory (spec.containers[*].volumeMounts.mountPath) by merging the manifest layers in the same way as for container images. The volume will be mounted read-only (ro) and non-executable files (noexec). Sub path mounts for containers are not supported (spec.containers[*].volumeMounts.subpath) before 1.33. The field spec.securityContext.fsGroupChangePolicy has no effect on this volume type.'
        $ref: '#/definitions/io.k8s.api.core.v1.ImageVolumeSource'
      iscsi:
        description: 'iscsi represents an ISCSI Disk resource that is attached to a kubelet''s host machine and then exposed to the pod. More info: https://kubernetes.io/docs/concepts/storage/volumes/#iscsi'
        $ref: '#/definitions/io.k8s.api.core.v1.ISCSIVolumeSource'
      name:
        description: 'name of the volume. Must be a DNS_LABEL and unique within the pod. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
        type: string
      nfs:
        description: 'nfs represents an NFS mount on the host that shares a pod''s lifetime More info: https://kubernetes.io/docs/concepts/storage/volumes#nfs'
        $ref: '#/definitions/io.k8s.api.core.v1.NFSVolumeSource'
      persistentVolumeClaim:
        description: 'persistentVolumeClaimVolumeSource represents a reference to a PersistentVolumeClaim in the same namespace. More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims'
        $ref: '#/definitions/io.k8s.api.core.v1.PersistentVolumeClaimVolumeSource'
      photonPersistentDisk:
        description: 'photonPersistentDisk represents a PhotonController persistent disk attached and mounted on kubelets host machine. Deprecated: PhotonPersistentDisk is deprecated and the in-tree photonPersistentDisk type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.PhotonPersistentDiskVolumeSource'
      portworxVolume:
        description: 'portworxVolume represents a portworx volume attached and mounted on kubelets host machine. Deprecated: PortworxVolume is deprecated. All operations for the in-tree portworxVolume type are redirected to the pxd.portworx.com CSI driver when the CSIMigrationPortworx feature-gate is on.'
        $ref: '#/definitions/io.k8s.api.core.v1.PortworxVolumeSource'
      projected:
        description: projected items for all in one resources secrets, configmaps, and downward API
        $ref: '#/definitions/io.k8s.api.core.v1.ProjectedVolumeSource'
      quobyte:
        description: 'quobyte represents a Quobyte mount on the host that shares a pod''s lifetime. Deprecated: Quobyte is deprecated and the in-tree quobyte type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.QuobyteVolumeSource'
      rbd:
        description: 'rbd represents a Rados Block Device mount on the host that shares a pod''s lifetime. Deprecated: RBD is deprecated and the in-tree rbd type is no longer supported.'
        $ref: '#/definitions/io.k8s.api.core.v1.RBDVolumeSource'
      scaleIO:
        description: 'scaleIO represents a ScaleIO persistent volume attached and mounted on Kubernetes nodes. Deprecated: ScaleIO is deprecated and the in-tree scaleIO type is no longer supported.'
